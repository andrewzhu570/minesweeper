<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Minesweeper</h1>

    <div class="controls">
        <button onclick="startNewGame()">New Game</button>
        <button id = "solve-btn" onclick="stepSolve()">Solve Step</button>
        <button id="auto-btn" onclick="toggleAutoSolve()">Auto Solve</button>
    </div>

    <div class="controls">
    <select id="difficulty">
        <option value="easy">Easy (8x8, 7 Mines)</option>
        <option value="medium" selected>Medium (10x10, 15 Mines)</option>
        <option value="hard">Hard (16x16, 40 Mines)</option>
        <option value="custom">Custom</option>
    </select>
        <div id="custom-inputs" style="display: none; margin-top: 8px;">
            <label>Size: <input type="number" id="custom-size" value="12" min="4" max="30" style="width: 50px;"></label>
            <label>Mines: <input type="number" id="custom-mines" value="20" min="1" max="200" style="width: 50px;"></label>
            <button onclick="startNewGame()">Confirm</button>
        </div>

    </div>
    <div class="timer-display">⏱ Time: <span id="timer">000</span></div>

    <div id="board" class="board"></div>
    <div id="status"></div>
    <script src="script.js"></script>
</body>
</html>
