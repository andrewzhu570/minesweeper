<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Minesweeper</h1>

    <div class="controls">
        <button onclick="startNewGame()">New Game</button>
        <button onclick="stepSolve()">Solve Step</button>
        <button id="auto-btn" onclick="toggleAutoSolve()">Auto Solve</button>
    </div>

    <div> id="board" class="board"></div>
    <div> id="status"></div>
    <script src="script.js"></script>
</body>
</html>
